  .col{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}

  /* 纸张 */
  .paper{background:rgba(244,232,208,.9);border:1px solid #b8a888;box-shadow:3px 4px 0 rgba(60,40,20,.2);position:relative}
  .paper::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 22px,rgba(60,40,20,.03) 22px,rgba(60,40,20,.03) 23px);pointer-events:none}

  /* 左侧 */
  .left{align-items:stretch}
  .avatar-wrap{position:relative;width:70px;height:70px;margin:10px auto 8px;cursor:pointer}
  .avatar-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3;border-radius:50%}
  .avatar{width:70px;height:70px;border-radius:50%;background:#d4c4a8;border:2px solid #8a6e4b;display:flex;align-items:center;justify-content:center;font-size:24px;color:#5a4030;overflow:hidden;box-shadow:2px 2px 0 rgba(60,40,20,.2)}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .name{text-align:center;font-size:16px;font-weight:700;color:#3a2a1a;margin-bottom:8px;letter-spacing:1px}
  .pills{display:flex;flex-direction:column;gap:4px;align-items:center;margin-bottom:10px}
  .pill{display:inline-block;padding:3px 10px;border:2px solid #8a6e4b;color:#5a4030;font-size:11px;font-weight:700;letter-spacing:.5px;background:#e8dcc8}
  .contact{padding:10px}
  .contact-title{font-size:10px;color:#8a6e4b;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:700;border-bottom:2px solid #8a6e4b;padding-bottom:3px}
  .contact-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;color:#5a4030;cursor:pointer}
  .contact-item:hover{color:#8a3a2a}
  .contact-item svg{width:14px;height:14px;stroke-width:1.8;flex-shrink:0}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:2px solid transparent;cursor:pointer;transition:all .2s;background:transparent;color:#5a4030;font-family:inherit;font-size:12px;text-align:left;width:100%;position:relative}
  .nav-item:hover{background:rgba(180,160,130,.3);border-color:#8a6e4b;transform:translateX(2px)}
  .nav-item.active{background:#e8dcc8;border-color:#8a3a2a;color:#8a3a2a;font-weight:700;box-shadow:2px 2px 0 rgba(60,40,20,.15)}
  .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:#8a3a2a;border-radius:0 2px 2px 0}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.8}

  /* 中间上 */
  .center-top{position:relative;width:100%;aspect-ratio:16/9;background:#e8dcc8;border:3px solid #8a6e4b;box-shadow:4px 5px 0 rgba(60,40,20,.25);overflow:hidden}
  .gallery-clip{position:absolute;inset:0;overflow:hidden}
  .gallery-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .8s}
  .gallery-img.active{opacity:1}
  .gallery-upload{position:absolute;bottom:8px;right:8px;z-index:10}
  .gallery-upload input{display:none}
  .gallery-upload label{display:inline-block;padding:5px 10px;background:#8a3a2a;color:#f4e8d0;font-size:11px;cursor:pointer;border:2px solid #5a2a1a;box-shadow:2px 2px 0 rgba(60,40,20,.2);font-family:inherit}
  .gallery-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
  .gallery-dot{width:8px;height:8px;border-radius:50%;background:rgba(90,64,48,.3);border:1px solid #5a4030;cursor:pointer}
  .gallery-dot.active{background:#8a3a2a}
  .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(244,232,208,.85);border:2px solid #8a6e4b;color:#5a4030;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:700;font-family:inherit}
  .gallery-prev{left:8px}
  .gallery-next{right:8px}

  /* 中间下 */
  .center-bottom{flex:1;overflow-y:auto;padding:14px}
  .page{display:none}
  .page.active{display:block;animation:fade .4s ease forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .page-title{font-size:20px;font-weight:700;color:#3a2a1a;margin-bottom:4px;letter-spacing:1px;border-bottom:3px double #8a6e4b;padding-bottom:5px}
  .page-sub{font-size:12px;color:#8a6e4b;margin-bottom:12px;font-style:italic}
  .card{background:rgba(244,232,208,.85);border:2px solid #c8b898;padding:14px;margin-bottom:12px;position:relative;box-shadow:2px 3px 0 rgba(60,40,20,.12);transition:transform .2s}
  .card:hover{transform:translateY(-2px)}
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
  .card:hover .card-actions{opacity:1}
  .btn-icon{width:22px;height:22px;border:1px solid #8a6e4b;background:#e8dcc8;color:#5a4030;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:inherit}
  .card h3,.card input.title-input{font-size:15px;font-weight:700;color:#3a2a1a;margin-bottom:6px;width:100%;border:none;background:transparent;font-family:inherit;outline:none}
  .card p,.card textarea.body-input{font-size:13px;line-height:1.8;color:#5a4030;width:100%;border:none;background:transparent;font-family:inherit;resize:vertical;outline:none;min-height:50px}
  .tag{display:inline-block;font-size:10px;padding:2px 8px;border:1px solid #8a6e4b;background:#e8dcc8;color:#5a4030;margin-right:4px;margin-bottom:4px;font-weight:700}
  .diary{margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed #c8b898;position:relative}
  .diary:last-child{border-bottom:none}
  .diary-date{font-size:10px;color:#8a3a2a;font-weight:700;letter-spacing:1px;margin-bottom:3px}
  .diary-title{font-size:14px;font-weight:700;color:#3a2a1a;margin-bottom:3px}
  .diary-excerpt{font-size:12px;color:#5a4030;line-height:1.7}
  .quote{border-left:4px solid #8a3a2a;padding-left:12px;font-style:italic;color:#6a5a4a;font-size:12px;line-height:1.8;margin:10px 0}
  .add-card{border:2px dashed #c8b898;padding:12px;text-align:center;color:#8a6e4b;cursor:pointer;background:rgba(244,232,208,.5);margin-bottom:12px;font-size:12px;font-family:inherit}
  .add-card:hover{border-color:#8a3a2a;color:#8a3a2a}
  .form{background:#f4e8d0;border:2px solid #8a6e4b;padding:14px;margin-bottom:12px;box-shadow:2px 3px 0 rgba(60,40,20,.15)}
  .form label{font-size:10px;color:#8a6e4b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;display:block;font-weight:700;font-family:inherit}
  .form input,.form textarea,.form select{width:100%;padding:8px 10px;border:1px solid #c8b898;font-family:inherit;font-size:13px;color:#3a2a1a;margin-bottom:10px;background:#e8dcc8;outline:none}
  .form input:focus,.form textarea:focus{border-color:#8a3a2a}
  .form-actions{display:flex;gap:8px;justify-content:flex-end}
  .btn{padding:6px 14px;border:2px solid #8a6e4b;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:#e8dcc8;color:#5a4030}
  .btn-primary{background:#8a3a2a;color:#f4e8d0;border-color:#5a2a1a}
  .btn:hover{transform:translateY(-1px);box-shadow:2px 2px 0 rgba(60,40,20,.15)}
  .cat-bubble{background:#f4e8d0;border:2px solid #c8b898;padding:12px;margin-bottom:8px;position:relative;box-shadow:2px 3px 0 rgba(60,40,20,.1)}
  .cat-bubble::after{content:'';position:absolute;bottom:-6px;left:20px;width:10px;height:10px;background:#f4e8d0;border-right:2px solid #c8b898;border-bottom:2px solid #c8b898;transform:rotate(45deg)}
  .cat-bubble p{font-size:12px;color:#5a4030;font-style:italic;line-height:1.7}
  .cat-meta{display:flex;align-items:center;gap:6px;margin:8px 0 12px 8px}
  .cat-avatar{width:24px;height:24px;border-radius:50%;background:#d4c4a8;display:flex;align-items:center;justify-content:center;font-size:12px}
  .cat-name{font-size:11px;font-weight:700;color:#5a4030}
  .cat-time{font-size:10px;color:#8a6e4b}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini-card{background:rgba(244,232,208,.85);border:2px solid #c8b898;padding:12px;text-align:center;box-shadow:2px 2px 0 rgba(60,40,20,.1)}
  .mini-card .icon{font-size:22px;margin-bottom:4px}
  .mini-card h4{font-size:12px;font-weight:700;color:#3a2a1a}
  .mini-card p{font-size:10px;color:#8a6e4b}
  .hero{text-align:center;padding:8px 0 12px}
  .hero h2{font-size:18px;font-weight:700;color:#3a2a1a;margin-bottom:4px}
  .hero .subtitle{font-size:12px;color:#8a3a2a;font-weight:700;letter-spacing:1px}
  .section-title{font-size:10px;font-weight:700;color:#8a3a2a;text-transform:uppercase;letter-spacing:2px;margin:16px 0 8px}

  /* 右侧 */
  .right{align-items:stretch}
  .counter{padding:12px;text-align:center}
  .counter-label{font-size:10px;color:#8a6e4b;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;font-weight:700}
  .counter-num{font-size:26px;font-weight:700;color:#8a3a2a;letter-spacing:2px;text-shadow:1px 1px 0 rgba(60,40,20,.2)}
  .calendar{padding:10px}
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;color:#3a2a1a}
  .cal-header button{background:transparent;border:none;font-family:inherit;font-size:14px;color:#8a6e4b;cursor:pointer;font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px}
  .cal-dayname{color:#8a6e4b;font-weight:700;padding:2px 0}
  .cal-day{padding:3px 0;color:#5a4030;cursor:pointer}
  .cal-day:hover{background:rgba(180,160,130,.3)}
  .cal-day.today{background:#8a3a2a;color:#f4e8d0;font-weight:700}
  .memo{flex:1;padding:14px;background:rgba(244,232,208,.85);border:1px solid #b8a888;box-shadow:3px 4px 0 rgba(60,40,20,.18);position:relative}
  .memo::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 22px,rgba(60,40,20,.03) 22px,rgba(60,40,20,.03) 23px);pointer-events:none}
  .memo-title{font-size:11px;color:#8a6e4b;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;font-weight:700;border-bottom:2px solid #8a6e4b;padding-bottom:4px;position:relative;z-index:1}
  .memo textarea{width:100%;height:calc(100% - 30px);border:1px dashed #c8b898;background:rgba(255,255,255,.3);font-family:inherit;font-size:12px;color:#5a4030;padding:8px;resize:none;outline:none;line-height:1.8;position:relative;z-index:1}
  .memo textarea:focus{border-color:#8a3a2a}

<script>
// 封面
function enterSite(){document.getElementById('cover').classList.add('hide')}

// 访客计数
let visitors=parseInt(localStorage.getItem('ms_visitors')||'1024');
visitors++;
localStorage.setItem('ms_visitors',visitors);
document.getElementById('visitor-num').textContent=visitors.toLocaleString();

// 日历
function renderCalendar(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const mn=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let h='<div class="cal-header"><button>‹</button><span>'+mn[m]+' '+y+'</span><button>›</button></div>';
  h+='<div class="cal-grid">';
  'SMTWTFS'.split('').forEach(d=>h+='<div class="cal-dayname">'+d+'</div>');
  for(let i=0;i<fd;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++)h+='<div class="cal-day '+(d===now.getDate()?'today':'')+'">'+d+'</div>';
  h+='</div>';
  document.getElementById('calendar').innerHTML=h;
}
renderCalendar();

// 图片轮播
let gImgs=[],gIdx=0,gTimer=null;
function renderGallery(){
  const c=document.getElementById('gallery-clip'),d=document.getElementById('gallery-dots');
  if(!gImgs.length){c.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#d4c4a8;color:#8a6e4b;font-size:13px">点击右下角 + 添加照片</div>';d.innerHTML='';return}
  c.innerHTML=gImgs.map((s,i)=>'<img class="gallery-img '+(i===gIdx?'active':'')+'" src="'+s+'">').join('');
  d.innerHTML=gImgs.map((_,i)=>'<div class="gallery-dot '+(i===gIdx?'active':'')+'" onclick="goGallery('+i+')"></div>').join('');
}
function galleryUpload(e){Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{gImgs.push(ev.target.result);renderGallery()};r.readAsDataURL(f)})}
function galleryPrev(){gIdx=(gIdx-1+gImgs.length)%gImgs.length;renderGallery()}
function galleryNext(){gIdx=(gIdx+1)%gImgs.length;renderGallery()}
function goGallery(i){gIdx=i;renderGallery()}
function startGallery(){gTimer=setInterval(galleryNext,4000)}
startGallery();
document.getElementById('gallery-box').addEventListener('mouseenter',()=>clearInterval(gTimer));
document.getElementById('gallery-box').addEventListener('mouseleave',startGallery);

// 头像
function uploadAvatar(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{document.getElementById('avatar-text').style.display='none';
    let i=document.querySelector('#avatar img');if(!i){i=document.createElement('img');document.getElementById('avatar').appendChild(i)}i.src=ev.target.result};
  r.readAsDataURL(f);
}

// 备忘录
const memo=document.getElementById('memo-text');
memo.value=localStorage.getItem('ms_memo')||'';
memo.addEventListener('input',()=>localStorage.setItem('ms_memo',memo.value));

// 页面数据
let cur='home',editId=null,addFor=null;
const pages={
  home:{title:'首页',sub:'从澜沧江到雅鲁藏布',items:[

    {id:'h2',type:'grid',title:'此刻状态',items:[{icon:'📍',title:'墨脱县中学',desc:'正在支教'},{icon:'🎓',title:'硕士预备',desc:'农业经济管理'},{icon:'🏉',title:'前校队队长',desc:'触式橄榄球'},{icon:'🎮',title:'空洞骑士',desc:'Steam 探索中'}]}
  ]},
  study:{title:'书房',sub:'食物经济学与 FOP 标签',items:[

    {id:'s2',type:'card',title:'核心发现',content:'评级型与信息型标签提升消费者对低糖产品的偏好。警示型标签显著降低过量糖产品的支付意愿。标签效果存在显著的消费者异质性。'},
    {id:'s3',type:'card',title:'方法工具箱',content:'混合Logit模型 · Delta方法 · Halton抽样 · WTP估计 · 异质性分析 · 倾向得分匹配'},
    {id:'s4',type:'quote',content:'食品标签不仅是信息传递工具，更是政策干预的微观入口。'}

    {id:'c2',type:'diary',date:'2025年8月 · 雨季',title:'第一次站在县中的讲台上',content:'教室的窗户正对着雅鲁藏布江的支流，雨季时江水是乳白色的。学生们用不太标准的普通话问我：老师，杭州有雪山吗？'},
    {id:'c3',type:'diary',date:'2025年7月 · 初到',title:'从拉萨到墨脱的三天',content:'翻越色季拉山口时海拔4700米，然后一路下降到1200米。植被从高山草甸变成亚热带雨林，墨脱的芭蕉树让我以为自己回到了云南。'},
    {id:'c4',type:'card',title:'双城记',content:'我镜头里的门巴族学生 vs 她镜头里的紫金港梧桐。小猫的"监护权"暂时移交，它大概不知道主人去了地图上没有标注清楚的地方。'}
  ]},
  kitchen:{title:'厨房',sub:'733小厨房',items:[
    {id:'k1',type:'card',title:'从各自吃到协作做饭',content:'两个人类在浙大附近某间小屋里的食物实验。从最初各自点外卖，到现在能协作完成一顿三菜一汤，733小厨房记录了我们共同生活的演化史。'},
    {id:'k2',type:'card',title:'最近菜单',content:'每道菜背后都有故事：柠檬手撕鸡是吵架后和好的信号，小锅米线是考前急救餐，煎牛排是周末慢炖的仪式感。',tags:['柠檬手撕鸡','小锅米线','鱼香肉丝','宫保鸡丁']},
    {id:'k3',type:'card',title:'两个ZJU学生的家务分工演化',content:'起初按"谁有空谁做"的模糊规则运行，效率低下且易生摩擦。后来逐步演化出基于比较优势的动态分工：我负责需要力气的切配与洗碗，她负责需要耐心的调味与火候控制。'},
    {id:'k4',type:'card',title:'她打游戏我改论文的夜晚',content:'客厅里她在空洞骑士的废墟中探索，书房里我在Stata的回归结果中挣扎。偶尔她卡关了会过来问我，我跑不出显著性了会去问她。两个屏幕的光是房间里唯一的照明。'}

  cat:{title:'阳台',sub:'小猫通讯社',items:[
    {id:'t1',type:'cat',content:'今日视察报告：厨房区域发现可疑香味，经调查系人类在烹饪鸡肉类制品。我已多次在厨房门口发出提醒，但人类似乎未能理解我的重要指示。将继续蹲守。',name:'小猫（待取名）',time:'今日 18:30 · 厨房门口'},
    {id:'t2',type:'cat',content:'两地书：致远在墨脱的人类。杭州近日多雨，阳台的绿萝长势良好。另一位人类每日按时投喂，但陪玩时间略有不足。望早日归来，带回高原的尘土与故事。',name:'小猫（待取名）',time:'昨日 21:00 · 阳台'},
    {id:'t3',type:'card',title:'同居法则',content:'猫有权在任何它想睡的地方睡觉，包括键盘上。做饭时掉在地上的食材归属猫，无需讨论。猫叫门时必须响应，延迟不得超过5秒。人类之间的争吵不得波及猫的投喂时间表。'}
  ]},
  sport:{title:'球场',sub:'触式橄榄球',items:[
    {id:'r1',type:'card',title:'前浙江大学触式橄榄球校队队长',content:'触式橄榄球（Touch Rugby）是一项没有身体冲撞的橄榄球运动，以"触式"代替扑搂，强调速度、传球与空间意识。在浙大紫金港的草地上，我度过了大学最热血的时光。'},
    {id:'r2',type:'card',title:'战术笔记',content:'Dummy跑：假传后变向，利用防守者重心偏移创造空间。长传转移：当一侧防守密集时，快速横传打开弱侧。六触轮转：六次触地后的攻防转换时机把握。'},
    {id:'r3',type:'card',title:'墨脱计划',content:'正在尝试将触式橄榄球引入县中体育课。没有标准场地，就用篮球场；没有橄榄球，先用足球替代。目标是让这些高原上的孩子体验团队协作与空间判断的乐趣。'},
    {id:'r4',type:'quote',content:'触式橄榄球教会我的不是冲撞，而是在高速移动中做出正确决策的能力。'}
  ]},
  game:{title:'存档点',sub:'Steam 游戏随笔',items:[
    {id:'g1',type:'card',title:'空洞骑士（Hollow Knight）',content:'在圣巢的废墟中探索，与感染对抗，寻找真相。这款游戏的难度曲线、氛围营造与碎片化叙事堪称独立游戏的标杆。最近卡在梦魇之王格林，正在反复练习。',tags:['类银河恶魔城','独立游戏','Team Cherry']},
    {id:'g2',type:'card',title:'一个研究者的游戏笔记',content:'圣巢的衰落与重建，和我在墨脱看到的教育现场形成某种遥远的呼应：一个曾经辉煌的王国因感染而衰败，正如偏远地区的基础教育因资源流失而薄弱。但游戏中总有小骑士在探索，现实中也有支教老师在坚持。'},
    {id:'g3',type:'card',title:'她看我打空洞骑士',content:'非玩家视角的观察："你为什么又在同一个地方死了？" "这个虫子看起来好恶心。" "等等，这个音乐还挺好听的。" 偶尔她会接过手柄，在十字路上迷路十分钟。'}
  ]},
  tool:{title:'工具箱',sub:'雅思手记',items:[
    {id:'l1',type:'card',title:'备考心得',content:'雅思不是语言能力的终点，而是学术英语的一次标准化校准。以下是我从实战中总结的方法论，适用于目标分数6.5-7.5的考生。'},
    {id:'l2',type:'card',title:'阅读：定位优先于理解',content:'不要试图读懂每一句。先读题，划出定位词（人名、数字、专有名词），回原文扫读找对应句。同义替换是核心考点，积累高频同义替换比背单词书更有效。'},
    {id:'l3',type:'card',title:'口语：Part 2 故事串题法',content:'准备5-6个万能故事核（一次旅行、一位老师、一个困难的决定），覆盖人物、地点、事件、物品四大类话题。考试时根据题目灵活嫁接，避免背诵痕迹。'},
    {id:'l4',type:'card',title:'写作：逻辑框架比高级词汇重要',content:'Task 2 采用四段式：开头改写题目+表明立场，两段主体分别论述两个论点（每段内部遵循"论点→解释→举例→回扣"），结尾总结。逻辑链断裂是低分的首要原因。'},
    {id:'l5',type:'card',title:'听力：预判与信号词',content:'读题时预判词性（空格里应该是名词还是数字？），听时重点捕捉转折词（but, however, actually）和强调词（in fact, the key is）。'}
  ]}
};

function uid(){return'x'+Math.random().toString(36).slice(2,9)}
function tags(t){if(!t||!t.length)return'';return'<div style="margin-bottom:6px">'+t.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>'}
function item(it,pid){
  if(editId===it.id){
    if(it.type==='diary')return'<div class="form" data-id="'+it.id+'"><label>日期</label><input class="diary-date-input" value="'+(it.date||'')+'"><label>标题</label><input class="diary-title-input" value="'+(it.title||'')+'"><label>内容</label><textarea class="diary-body-input">'+(it.content||'')+'</textarea><div class="form-actions"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn btn-primary" onclick="saveEdit(''+pid+'')">保存</button></div></div>';
    return'<div class="form" data-id="'+it.id+'"><label>标题</label><input class="title-input" value="'+(it.title||'')+'"><label>内容</label><textarea class="body-input">'+(it.content||'')+'</textarea><div class="form-actions"><button class="btn" onclick="cancelEdit()">取消</button><button class="btn btn-primary" onclick="saveEdit(''+pid+'')">保存</button></div></div>';
  }
  if(it.type==='hero')return'<div class="hero"><h2>'+(it.title||'')+'</h2><p class="subtitle">'+pages[pid].sub+'</p></div><div class="card"><div class="card-actions"><button class="btn-icon" onclick="startEdit(''+it.id+'')">✎</button><button class="btn-icon" onclick="delItem(''+pid+'',''+it.id+'')">✕</button></div><p>'+(it.content||'')+'</p></div>';
  if(it.type==='grid')return'<div class="section-title">'+it.title+'</div><div class="grid-2">'+it.items.map(g=>'<div class="mini-card"><div class="icon">'+g.icon+'</div><h4>'+g.title+'</h4><p>'+g.desc+'</p></div>').join('')+'</div>';
  if(it.type==='diary')return'<div class="diary"><div class="card-actions"><button class="btn-icon" onclick="startEdit(''+it.id+'')">✎</button><button class="btn-icon" onclick="delItem(''+pid+'',''+it.id+'')">✕</button></div><div class="diary-date">'+(it.date||'')+'</div><div class="diary-title">'+(it.title||'')+'</div><div class="diary-excerpt">'+(it.content||'')+'</div></div>';
  if(it.type==='cat')return'<div class="cat-bubble"><div class="card-actions" style="opacity:1"><button class="btn-icon" onclick="startEdit(''+it.id+'')">✎</button><button class="btn-icon" onclick="delItem(''+pid+'',''+it.id+'')">✕</button></div><p>'+(it.content||'')+'</p></div><div class="cat-meta"><div class="cat-avatar">🐱</div><div><div class="cat-name">'+(it.name||'')+'</div><div class="cat-time">'+(it.time||'')+'</div></div></div>';
  if(it.type==='quote')return'<div class="quote">'+(it.content||'')+'</div>';
  return'<div class="card"><div class="card-actions"><button class="btn-icon" onclick="startEdit(''+it.id+'')">✎</button><button class="btn-icon" onclick="delItem(''+pid+'',''+it.id+'')">✕</button></div>'+(it.title?'<h3>'+it.title+'</h3>':'')+tags(it.tags)+'<p>'+(it.content||'')+'</p></div>';
}
function render(pid){
  const p=pages[pid];let h='<div class="page-title">'+p.title+'</div><div class="page-sub">'+p.sub+'</div>';
  h+=p.items.map(it=>item(it,pid)).join('');
  if(addFor===pid){
    h+='<div class="form"><label>类型</label><select id="add-type" style="width:100%;padding:8px 10px;border:1px solid #c8b898;font-family:inherit;font-size:13px;color:#3a2a1a;margin-bottom:10px;background:#e8dcc8;outline:none" onchange="toggleAddForm()"><option value="card">卡片</option><option value="diary">日记</option></select><div id="add-form-body"><label>标题</label><input id="add-title" placeholder="标题"><label>内容</label><textarea id="add-body" placeholder="内容"></textarea></div><div class="form-actions"><button class="btn" onclick="cancelAdd()">取消</button><button class="btn btn-primary" onclick="saveAdd(''+pid+'')">添加</button></div></div>';
  }else{
    h+='<div class="add-card" onclick="startAdd(''+pid+'')">+ 添加新内容</div>';
  }
  document.getElementById('main').innerHTML='<div class="page active">'+h+'</div>';
}
function switchPage(pid,btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');cur=pid;editId=null;addFor=null;render(pid);
}
window.startEdit=function(id){editId=id;render(cur)};
window.cancelEdit=function(){editId=null;render(cur)};
window.saveEdit=function(pid){
  const f=document.querySelector('.form[data-id="'+editId+'"]');if(!f)return;
  const it=pages[pid].items.find(x=>x.id===editId);if(!it)return;
  if(it.type==='diary'){it.date=f.querySelector('.diary-date-input').value;it.title=f.querySelector('.diary-title-input').value;it.content=f.querySelector('.diary-body-input').value}
  else{it.title=f.querySelector('.title-input').value;it.content=f.querySelector('.body-input').value}
  editId=null;render(pid);
};
window.delItem=function(pid,id){if(!confirm('确定删除？'))return;pages[pid].items=pages[pid].items.filter(x=>x.id!==id);render(pid)};
window.startAdd=function(pid){addFor=pid;render(cur)};
window.cancelAdd=function(){addFor=null;render(cur)};
window.toggleAddForm=function(){
  const t=document.getElementById('add-type').value,b=document.getElementById('add-form-body');
  if(t==='diary')b.innerHTML='<label>日期</label><input id="add-date" placeholder="例如：2025年8月"><label>标题</label><input id="add-title" placeholder="标题"><label>内容</label><textarea id="add-body" placeholder="内容"></textarea>';
  else b.innerHTML='<label>标题</label><input id="add-title" placeholder="标题"><label>内容</label><textarea id="add-body" placeholder="内容"></textarea>';
};
window.saveAdd=function(pid){
  const t=document.getElementById('add-type').value,title=document.getElementById('add-title').value,body=document.getElementById('add-body').value;
  if(!title.trim()&&!body.trim()){alert('请至少填写标题或内容');return}
  const ni={id:uid(),type:t,title:title,content:body};if(t==='diary')ni.date=document.getElementById('add-date').value||'';
  pages[pid].items.push(ni);addFor=null;render(pid);
};
render('home');
</script>
</body>
</html>
