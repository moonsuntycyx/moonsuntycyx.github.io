<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人主页</title>
  <style>
    :root {
      --paper: #efe1c2;
      --paper-deep: #dcc18f;
      --cream: #fff4d6;
      --amber: #c9842f;
      --ochre: #9c672b;
      --brown: #4a2c1b;
      --brown-soft: #77543b;
      --blue: #2f6171;
      --blue-deep: #1d4150;
      --brick: #8a4034;
      --olive: #5f6f42;
      --ink: #2c2019;
      --shadow: rgba(66, 39, 20, 0.22);
      --rail: clamp(220px, 20vw, 310px);
      --gap: clamp(14px, 2vw, 28px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      font-family: FangSong, STFangsong, "Songti SC", "Noto Serif SC", serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 244, 214, 0.52) 0 18%, transparent 18.4%),
        linear-gradient(115deg, rgba(126, 84, 38, 0.08), transparent 28%, rgba(47, 97, 113, 0.08) 72%, transparent),
        radial-gradient(rgba(74, 44, 27, 0.12) 0.8px, transparent 0.9px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.28), rgba(156, 103, 43, 0.09));
      background-size: 100% 100%, 100% 100%, 9px 9px, 100% 100%;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    body::before {
      opacity: 0.18;
      mix-blend-mode: multiply;
      background:
        repeating-linear-gradient(0deg, rgba(74, 44, 27, 0.09) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(90deg, rgba(255, 244, 214, 0.16) 0 1px, transparent 1px 7px);
    }

    body::after {
      opacity: 0.16;
      background-image: radial-gradient(rgba(44, 32, 25, 0.45) 0.7px, transparent 0.8px);
      background-size: 4px 4px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    label.upload-label,
    select {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    .left-rail,
    .right-rail {
      position: fixed;
      top: 0;
      bottom: 0;
      width: var(--rail);
      padding: 22px 18px;
      overflow-y: auto;
      z-index: 5;
    }

    .left-rail {
      left: 0;
      border-right: 2px dashed rgba(74, 44, 27, 0.35);
      background:
        linear-gradient(90deg, rgba(255, 244, 214, 0.6), rgba(239, 225, 194, 0.86)),
        repeating-linear-gradient(-5deg, transparent 0 15px, rgba(156, 103, 43, 0.07) 15px 16px);
    }

    .right-rail {
      right: 0;
      border-left: 2px dashed rgba(74, 44, 27, 0.35);
      background:
        linear-gradient(270deg, rgba(255, 244, 214, 0.65), rgba(239, 225, 194, 0.86)),
        repeating-linear-gradient(5deg, transparent 0 15px, rgba(47, 97, 113, 0.07) 15px 16px);
    }

    .center-stage {
      width: calc(100% - (var(--rail) * 2));
      min-height: 100vh;
      margin-left: var(--rail);
      margin-right: var(--rail);
      padding: 24px clamp(18px, 3vw, 44px) 40px;
    }

    .scrap-panel {
      position: relative;
      margin-bottom: 18px;
      padding: 16px;
      border: 2px solid rgba(74, 44, 27, 0.78);
      border-radius: 18px 12px 16px 10px / 13px 18px 12px 16px;
      background: rgba(255, 244, 214, 0.62);
      box-shadow: 0 16px 28px rgba(74, 44, 27, 0.12);
    }

    .scrap-panel::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(74, 44, 27, 0.24);
      border-radius: inherit;
      pointer-events: none;
    }

    .profile {
      text-align: center;
      padding-top: 20px;
    }

    .avatar-label {
      display: inline-grid;
      place-items: center;
      width: clamp(126px, 11vw, 156px);
      aspect-ratio: 1;
      margin: 0 auto 14px;
      border: 3px solid var(--brown);
      border-radius: 58% 42% 55% 45% / 45% 52% 48% 55%;
      outline: 6px solid rgba(255, 244, 214, 0.86);
      background:
        radial-gradient(circle at 52% 38%, rgba(255, 244, 214, 0.72), transparent 35%),
        linear-gradient(135deg, rgba(201, 132, 47, 0.9), rgba(47, 97, 113, 0.72));
      box-shadow:
        0 12px 22px rgba(74, 44, 27, 0.25),
        inset 0 0 0 5px rgba(74, 44, 27, 0.12);
      overflow: hidden;
      cursor: pointer;
      transform: rotate(-2deg);
      transition: transform 180ms ease, filter 180ms ease;
    }

    .avatar-label:hover {
      transform: rotate(-1deg) scale(1.025);
      filter: saturate(1.06);
    }

    .avatar-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--cream);
      font-weight: 700;
      font-size: clamp(28px, 3vw, 42px);
      letter-spacing: 0;
      text-shadow: 0 2px 4px rgba(44, 32, 25, 0.32);
    }

    .avatar-command,
    .panel-title {
      position: relative;
      z-index: 1;
    }

    .avatar-command {
      display: inline-block;
      padding: 5px 12px;
      color: var(--cream);
      background: var(--blue-deep);
      border: 1px solid rgba(74, 44, 27, 0.45);
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(74, 44, 27, 0.18);
      font-size: 0.92rem;
    }

    .intro-lines {
      position: relative;
      z-index: 1;
      margin: 18px 0 2px;
      padding: 12px 4px 14px;
      border-bottom: 1px dashed rgba(74, 44, 27, 0.52);
      color: var(--brown);
      line-height: 1.75;
      font-weight: 700;
    }

    .intro-lines span {
      display: block;
    }

    .brand-stamp {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 9px;
      border: 2px solid rgba(138, 64, 52, 0.78);
      color: var(--brick);
      font-size: 0.78rem;
      font-weight: 700;
      transform: rotate(3deg);
    }

    .panel-title {
      margin: 0 0 12px;
      color: var(--blue-deep);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .nav-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 8px;
    }

    .nav-item {
      position: relative;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      color: var(--brown);
      background: transparent;
      text-align: left;
      line-height: 1.25;
      transition: transform 160ms ease, color 160ms ease;
    }

    .nav-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 5px;
      height: 5px;
      border: 1px solid var(--ochre);
      border-radius: 50%;
      transform: translateY(-50%);
      background: var(--cream);
    }

    .nav-item::after {
      content: "";
      position: absolute;
      left: 12px;
      right: auto;
      bottom: 4px;
      width: 0;
      border-bottom: 2px solid var(--amber);
      transition: width 180ms ease;
    }

    .nav-item:hover,
    .nav-item.is-active {
      color: var(--blue-deep);
      transform: translateX(3px) scale(1.015);
    }

    .nav-item:hover::after,
    .nav-item.is-active::after {
      width: calc(100% - 24px);
    }

    .nav-item.is-active {
      font-weight: 800;
    }

    .carousel-section,
    .content-section {
      position: relative;
      border: 2px solid rgba(74, 44, 27, 0.78);
      background: rgba(255, 244, 214, 0.58);
      box-shadow: 0 22px 38px rgba(74, 44, 27, 0.16);
    }

    .carousel-section {
      min-height: clamp(260px, 34vh, 420px);
      margin-bottom: 24px;
      padding: clamp(14px, 2vw, 22px);
      border-radius: 16px 12px 20px 14px / 14px 20px 12px 18px;
      overflow: hidden;
    }

    .carousel-section::before,
    .content-section::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(74, 44, 27, 0.22);
      pointer-events: none;
      border-radius: inherit;
      z-index: 0;
    }

    .carousel-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      height: 100%;
    }

    .photo-frame {
      position: relative;
      min-height: clamp(220px, 30vh, 365px);
      padding: 14px;
      border: 2px solid rgba(74, 44, 27, 0.68);
      background: #f9ecd0;
      box-shadow:
        inset 0 0 0 8px rgba(255, 244, 214, 0.8),
        0 18px 28px rgba(74, 44, 27, 0.2);
      transform: rotate(-0.8deg);
      overflow: hidden;
    }

    .photo-frame::before,
    .photo-frame::after,
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 76px;
      height: 24px;
      background:
        linear-gradient(90deg, rgba(255, 244, 214, 0.42), rgba(255, 244, 214, 0.82), rgba(255, 244, 214, 0.42));
      border: 1px solid rgba(156, 103, 43, 0.22);
      box-shadow: 0 3px 8px rgba(74, 44, 27, 0.12);
      opacity: 0.88;
      z-index: 3;
    }

    .photo-frame::before {
      top: 8px;
      left: 18px;
      transform: rotate(-9deg);
    }

    .photo-frame::after {
      right: 22px;
      bottom: 10px;
      transform: rotate(-7deg);
    }

    .carousel-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: inherit;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(47, 97, 113, 0.8), rgba(201, 132, 47, 0.8)),
        repeating-linear-gradient(0deg, rgba(255, 244, 214, 0.16) 0 8px, transparent 8px 14px);
    }

    .carousel-viewport img {
      width: 100%;
      height: 100%;
      min-height: inherit;
      display: block;
      object-fit: cover;
      filter: sepia(0.22) saturate(0.9) contrast(1.05);
      animation: photoFade 420ms ease;
    }

    .painted-placeholder {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        linear-gradient(160deg, rgba(29, 65, 80, 0.82), transparent 38%),
        linear-gradient(25deg, rgba(201, 132, 47, 0.88), transparent 44%),
        linear-gradient(120deg, rgba(255, 244, 214, 0.55), transparent 70%),
        #9c672b;
    }

    .painted-placeholder::before,
    .painted-placeholder::after {
      content: "";
      position: absolute;
      left: -12%;
      right: -12%;
      height: 22%;
      border-radius: 48%;
      opacity: 0.58;
      filter: blur(0.2px);
    }

    .painted-placeholder::before {
      top: 26%;
      background: rgba(255, 244, 214, 0.42);
      transform: rotate(-6deg);
    }

    .painted-placeholder::after {
      bottom: 21%;
      background: rgba(29, 65, 80, 0.46);
      transform: rotate(5deg);
    }

    .placeholder-title {
      position: absolute;
      left: 28px;
      bottom: 28px;
      max-width: min(520px, 78%);
      color: var(--cream);
      font-size: clamp(2rem, 5vw, 4.8rem);
      font-weight: 900;
      line-height: 0.95;
      text-shadow: 0 4px 12px rgba(44, 32, 25, 0.45);
    }

    .carousel-tools {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      min-width: 120px;
    }

    .tool-stack {
      display: grid;
      gap: 8px;
    }

    .small-button,
    .upload-label,
    .select-box {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid rgba(74, 44, 27, 0.58);
      border-radius: 8px 7px 9px 6px / 7px 9px 6px 8px;
      color: var(--brown);
      background: rgba(255, 244, 214, 0.86);
      box-shadow: 0 4px 0 rgba(74, 44, 27, 0.12);
      text-decoration: none;
      transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
    }

    .small-button:hover,
    .upload-label:hover {
      color: var(--cream);
      background: var(--blue);
      transform: translateY(-1px);
    }

    .icon-button {
      width: 42px;
      aspect-ratio: 1;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      font-size: 1.5rem;
      line-height: 1;
    }

    .carousel-nav {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .carousel-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      padding: 0;
      min-height: 0;
      border: 1px solid rgba(74, 44, 27, 0.58);
      border-radius: 50%;
      background: var(--cream);
      box-shadow: none;
    }

    .dot.is-active {
      background: var(--brick);
    }

    .content-section {
      min-height: 62vh;
      padding: clamp(16px, 2.5vw, 28px);
      border-radius: 12px 18px 14px 20px / 18px 12px 20px 14px;
    }

    .section-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 2px dashed rgba(74, 44, 27, 0.35);
    }

    .section-kicker {
      display: inline-block;
      margin-bottom: 5px;
      color: var(--brick);
      font-size: 0.95rem;
      font-weight: 800;
    }

    .section-title {
      margin: 0;
      color: var(--brown);
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .section-subtitle {
      max-width: 560px;
      margin: 9px 0 0;
      color: var(--brown-soft);
      line-height: 1.65;
    }

    .add-tools {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: min(290px, 100%);
    }

    .select-box {
      min-width: 112px;
      color: var(--brown);
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--brown) 50%),
        linear-gradient(135deg, var(--brown) 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 50%,
        calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }

    .cards-flow {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: clamp(14px, 2vw, 22px);
    }

    .cards-flow.is-fading {
      animation: sectionFade 320ms ease;
    }

    .card {
      --tilt: 0deg;
      position: relative;
      min-width: 0;
      padding: 18px;
      border: 1.5px solid rgba(74, 44, 27, 0.66);
      border-radius: 8px 7px 8px 6px;
      background:
        linear-gradient(180deg, rgba(255, 244, 214, 0.88), rgba(235, 204, 151, 0.82)),
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(74, 44, 27, 0.09) 23px 24px);
      box-shadow: 0 14px 26px rgba(74, 44, 27, 0.2);
      transform: rotate(var(--tilt));
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .card:nth-child(4n + 1) {
      --tilt: -1.4deg;
    }

    .card:nth-child(4n + 2) {
      --tilt: 1.1deg;
      background:
        linear-gradient(180deg, rgba(226, 238, 232, 0.9), rgba(191, 211, 203, 0.76)),
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(47, 97, 113, 0.09) 23px 24px);
    }

    .card:nth-child(4n + 3) {
      --tilt: 0.7deg;
      background:
        linear-gradient(180deg, rgba(255, 239, 190, 0.92), rgba(238, 190, 105, 0.72)),
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(156, 103, 43, 0.1) 23px 24px);
    }

    .card:nth-child(4n + 4) {
      --tilt: -0.6deg;
      background:
        linear-gradient(180deg, rgba(247, 225, 210, 0.92), rgba(209, 166, 135, 0.72)),
        repeating-linear-gradient(0deg, transparent 0 23px, rgba(138, 64, 52, 0.1) 23px 24px);
    }

    .card:hover {
      transform: rotate(0deg) translateY(-2px);
      box-shadow: 0 18px 34px rgba(74, 44, 27, 0.24);
    }

    .card::before {
      top: -10px;
      left: 18px;
      transform: rotate(-8deg);
    }

    .card::after {
      right: 20px;
      bottom: -9px;
      transform: rotate(6deg);
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin: -4px -4px 10px 0;
      flex-wrap: wrap;
    }

    .card-actions .small-button,
    .card-actions .upload-label {
      min-height: 28px;
      padding: 4px 9px;
      font-size: 0.86rem;
      box-shadow: 0 3px 0 rgba(74, 44, 27, 0.1);
    }

    .delete-button:hover {
      background: var(--brick);
      color: var(--cream);
    }

    .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-bottom: 14px;
      border: 8px solid rgba(255, 244, 214, 0.86);
      box-shadow: inset 0 0 0 1px rgba(74, 44, 27, 0.42), 0 8px 14px rgba(74, 44, 27, 0.16);
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(47, 97, 113, 0.78), rgba(95, 111, 66, 0.45)),
        repeating-linear-gradient(-12deg, transparent 0 18px, rgba(255, 244, 214, 0.17) 18px 24px);
    }

    .card-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: sepia(0.18) saturate(0.92) contrast(1.04);
    }

    .card-image.empty::before,
    .card-image.empty::after {
      content: "";
      position: absolute;
      inset: auto -12% 22% -12%;
      height: 30%;
      background: rgba(255, 244, 214, 0.38);
      transform: rotate(-5deg);
    }

    .card-image.empty::after {
      inset: 20% -12% auto -12%;
      background: rgba(138, 64, 52, 0.28);
      transform: rotate(7deg);
    }

    .editable {
      min-width: 0;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-radius: 6px;
      transition: background-color 140ms ease, box-shadow 140ms ease;
    }

    .editable:focus {
      background: rgba(255, 244, 214, 0.58);
      box-shadow: 0 0 0 2px rgba(47, 97, 113, 0.24);
    }

    .card-title {
      margin: 0 0 8px;
      color: var(--brown);
      font-size: clamp(1.18rem, 2vw, 1.55rem);
      line-height: 1.2;
      font-weight: 900;
    }

    .card-text {
      margin: 0;
      color: #3c2a20;
      line-height: 1.7;
      font-size: 1.02rem;
    }

    .quote-card {
      border-color: rgba(47, 97, 113, 0.72);
    }

    .quote-text {
      margin: 4px 0 12px;
      padding-left: 16px;
      border-left: 4px solid var(--blue);
      color: var(--blue-deep);
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      line-height: 1.55;
      font-weight: 800;
    }

    .quote-source {
      margin: 0;
      color: var(--brown-soft);
      text-align: right;
      line-height: 1.5;
    }

    .timeline-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
    }

    .timeline-card .card-actions {
      grid-column: 1 / -1;
    }

    .timeline-date {
      align-self: start;
      min-width: 74px;
      padding: 7px 8px;
      color: var(--cream);
      background: var(--brick);
      border: 1px solid rgba(74, 44, 27, 0.38);
      border-radius: 8px;
      text-align: center;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(74, 44, 27, 0.13);
    }

    .counter-panel {
      text-align: center;
    }

    .counter {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 10px;
    }

    .counter span {
      display: grid;
      place-items: center;
      width: 30px;
      height: 42px;
      color: #f7d989;
      background:
        linear-gradient(180deg, #1b1714, #3b2a20 49%, #17110d 50%, #36251b);
      border: 1px solid rgba(255, 244, 214, 0.16);
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 5px 9px rgba(74, 44, 27, 0.2);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .date-label {
      position: relative;
      z-index: 1;
      margin: 10px 0 0;
      color: var(--brown-soft);
      line-height: 1.5;
    }

    .calendar-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .calendar-title {
      color: var(--brown);
      font-size: 1.08rem;
      font-weight: 900;
      text-align: center;
    }

    .calendar-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekday,
    .day {
      min-width: 0;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 7px 6px 8px 6px;
      line-height: 1;
      font-size: 0.92rem;
    }

    .weekday {
      color: var(--blue-deep);
      font-weight: 900;
    }

    .day {
      position: relative;
      border: 1px solid rgba(74, 44, 27, 0.22);
      color: var(--brown);
      background: rgba(255, 244, 214, 0.58);
    }

    .day:not(.empty):hover {
      color: var(--cream);
      background: var(--blue);
    }

    .day.today {
      color: var(--cream);
      background: var(--brick);
      font-weight: 900;
    }

    .day.marked::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      right: 4px;
      bottom: 4px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 1px rgba(74, 44, 27, 0.28);
    }

    .memo-tools {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .memo-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .memo {
      position: relative;
      padding: 12px 34px 12px 12px;
      min-height: 76px;
      color: #342219;
      border: 1px solid rgba(74, 44, 27, 0.28);
      border-radius: 6px 7px 5px 8px;
      background:
        linear-gradient(180deg, rgba(255, 238, 154, 0.94), rgba(230, 192, 82, 0.78)),
        repeating-linear-gradient(0deg, transparent 0 21px, rgba(74, 44, 27, 0.12) 21px 22px);
      box-shadow: 0 10px 16px rgba(74, 44, 27, 0.16);
      transform: rotate(-1deg);
    }

    .memo:nth-child(2n) {
      transform: rotate(1deg);
      background:
        linear-gradient(180deg, rgba(202, 225, 223, 0.94), rgba(151, 188, 192, 0.78)),
        repeating-linear-gradient(0deg, transparent 0 21px, rgba(47, 97, 113, 0.13) 21px 22px);
    }

    .memo:nth-child(3n) {
      background:
        linear-gradient(180deg, rgba(245, 211, 188, 0.94), rgba(207, 151, 123, 0.74)),
        repeating-linear-gradient(0deg, transparent 0 21px, rgba(138, 64, 52, 0.13) 21px 22px);
    }

    .memo-date {
      margin-bottom: 6px;
      color: var(--blue-deep);
      font-size: 0.82rem;
      font-weight: 900;
    }

    .memo-text {
      line-height: 1.5;
    }

    .memo-delete {
      position: absolute;
      top: 7px;
      right: 7px;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid rgba(74, 44, 27, 0.28);
      border-radius: 50%;
      color: var(--brown);
      background: rgba(255, 244, 214, 0.66);
      line-height: 1;
    }

    .memo-delete:hover {
      color: var(--cream);
      background: var(--brick);
    }

    .empty-state {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 12px;
      border: 1px dashed rgba(74, 44, 27, 0.4);
      color: var(--brown-soft);
      line-height: 1.5;
      background: rgba(255, 244, 214, 0.42);
    }

    @keyframes sectionFade {
      from {
        opacity: 0;
        transform: translateY(6px);

      to {
        opacity: 1;
        transform: translateY(0);

    /* Refined four-color art direction: #2C3735, #8E3A2A, #557B78, #D5C09C */
    :root {
      --paper: #D5C09C;
      --paper-deep: #D5C09C;
      --cream: #D5C09C;
      --amber: #8E3A2A;
      --ochre: #8E3A2A;
      --brown: #2C3735;
      --brown-soft: #557B78;
      --blue: #557B78;
      --blue-deep: #2C3735;
      --brick: #8E3A2A;
      --olive: #557B78;
      --ink: #2C3735;
      --sand: #D5C09C;
      --dark: #2C3735;
      --rust: #8E3A2A;
      --mist: #557B78;
      --shadow: rgba(44, 55, 53, 0.34);
      --rail: clamp(230px, 20vw, 330px);
      --gap: clamp(16px, 2vw, 30px);
    }

    html {
      background: #2C3735;
    }

    body {
      color: #D5C09C;
      background:
        linear-gradient(135deg, rgba(44, 55, 53, 1), rgba(44, 55, 53, 0.94)),
        linear-gradient(90deg, rgba(85, 123, 120, 0.16), transparent 35%, rgba(142, 58, 42, 0.14));
      background-color: #2C3735;
    }

    body::before {
      opacity: 1;
      mix-blend-mode: normal;
      background:
        linear-gradient(90deg, transparent 0, transparent calc(20vw - 1px), rgba(213, 192, 156, 0.16) calc(20vw - 1px), rgba(213, 192, 156, 0.16) 20vw, transparent 20vw),
        linear-gradient(90deg, transparent 0, transparent calc(80vw - 1px), rgba(213, 192, 156, 0.16) calc(80vw - 1px), rgba(213, 192, 156, 0.16) 80vw, transparent 80vw),
        linear-gradient(180deg, rgba(213, 192, 156, 0.08), transparent 38%, rgba(85, 123, 120, 0.10));
    }

    body::after {
      opacity: 1;
      background:
        linear-gradient(90deg, rgba(213, 192, 156, 0.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(213, 192, 156, 0.04) 1px, transparent 1px);
      background-size: 78px 78px;
    }

    .left-rail,
    .right-rail {
      padding: 26px 20px;

      position: relative;
      z-index: 1;
      width: fit-content;
      margin: 10px auto 8px;
      padding: 5px 15px 6px;
      border: 3px solid var(--line);
      border-radius: 999px;
      color: var(--line);
      background: var(--cream);

      font-size: 1.16rem;
      font-weight: 900;
      transform: rotate(-2deg);

    /* Bright anime diary direction */
    :root {
      --sky: #bfefff;
      --sky-soft: #eaffff;
      --cream: #fff7d8;
      --line: #2f4550;
      --pink: #ff9fb7;
      --red: #ef6a5a;
      --yellow: #ffd86b;
      --green: #73c66a;
      --green-deep: #3e9d61;
      --blue: #6ab6ff;
      --blue-deep: #4a83df;
      --lavender: #c8b6ff;
      --orange: #ffb35c;
      --ink: #2f4550;
      --rail: clamp(220px, 20vw, 300px);
      --shadow: rgba(47, 69, 80, 0.16);
    }

    html {
      background: var(--sky-soft);
    }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 11%, rgba(255, 216, 107, 0.75) 0 76px, transparent 78px),
        radial-gradient(circle at 84% 10%, rgba(255, 159, 183, 0.32) 0 112px, transparent 114px),
        linear-gradient(180deg, #bfefff 0%, #eaffff 45%, #fff7d8 80%, #d8f7a6 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: none;
    }

      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;

    .tree-right {
      right: 24px;
      transform: scale(0.82) rotate(5deg);
    }

    .room-window {
      position: fixed;
      right: clamp(18px, 2vw, 38px);
      bottom: clamp(132px, 18vh, 220px);
      width: 160px;
      height: 132px;
      border: 3px solid var(--line);
      border-radius: 24px;
      background: var(--cream);
      box-shadow: 10px 12px 0 rgba(47, 69, 80, 0.08);
      transform: rotate(3deg);
    }

    .room-window::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 3px solid var(--line);
    }

    .room-window::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 3px solid var(--line);
    }

    .curtain,
    .desk,
    .cat {
      position: absolute;
      z-index: 1;
      display: block;
    }

    .curtain {
      left: 9px;
      top: 10px;
      width: 44px;
      height: 68px;
      border: 3px solid var(--line);
      border-radius: 20px 8px 18px 8px;
      background: var(--pink);
    }

    .desk {
      left: 26px;
      right: 26px;
      bottom: 18px;
      height: 16px;
      border: 3px solid var(--line);
      border-radius: 999px;
      background: var(--orange);
    }

    .cat {
      right: 30px;
      bottom: 33px;
      width: 34px;
      height: 28px;
      border: 3px solid var(--line);
      border-radius: 50% 50% 44% 44%;
      background: var(--cream);
    }

    .cat::before,
    .cat::after {
      content: "";
      position: absolute;
      top: -9px;
      width: 12px;
      height: 12px;
      border-top: 3px solid var(--line);
      border-left: 3px solid var(--line);
      background: var(--cream);
      transform: rotate(45deg);
    }

    .cat::before {
      left: 2px;
    }

    .cat::after {
      right: 2px;
    }

    .left-rail,
    .right-rail,
    .center-stage {
      position: relative;
      z-index: 2;
    }

    .left-rail,
    .right-rail {
      position: fixed;
      padding: 24px 18px;
      background: transparent;
      border: 0;
      backdrop-filter: none;
      scrollbar-color: rgba(47, 69, 80, 0.34) transparent;
    }

    .center-stage {
      padding: clamp(18px, 2.4vw, 34px);
    }

    .scrap-panel,
    .carousel-section,
    .content-section {
      border: 0;
      border-radius: 30px;
      background: rgba(255, 247, 216, 0.84);
      box-shadow: 0 12px 0 rgba(47, 69, 80, 0.08), 0 20px 44px rgba(47, 69, 80, 0.12);
      backdrop-filter: blur(4px);
    }

    .scrap-panel::before,
    .carousel-section::before,
    .content-section::before {
      content: "";
      inset: 0;
      border: 3px solid var(--line);
      border-radius: inherit;
      background: transparent;
      opacity: 1;
    }

    .content-section,
    .right-rail .scrap-panel {
      background: rgba(255, 247, 216, 0.68);
      box-shadow: 0 18px 44px rgba(47, 69, 80, 0.10);
    }

    .content-section::before,
    .right-rail .scrap-panel::before {
      border: 0;
    }

    .content-section::after {
      content: "";
      position: absolute;
      right: 24px;
      top: 20px;
      width: 84px;
      height: 38px;
      border-top: 3px solid var(--line);
      border-radius: 50%;
      transform: rotate(8deg);
      opacity: 0.5;
      pointer-events: none;
    }

    .profile {
      padding: 24px 18px 20px;
      transform: rotate(-1.2deg);
    }

    .avatar-label {
      width: clamp(124px, 11vw, 156px);
      border: 3px solid var(--line);
      border-radius: 42% 58% 45% 55% / 54% 46% 56% 44%;
      outline: 0;
      background:
        radial-gradient(circle at 64% 34%, var(--pink) 0 14px, transparent 15px),
        radial-gradient(circle at 36% 62%, var(--yellow) 0 18px, transparent 19px),
        linear-gradient(135deg, var(--blue), var(--sky-soft));
      box-shadow: 6px 8px 0 rgba(47, 69, 80, 0.12);
      transform: rotate(2deg);
    }

    .avatar-label:hover {
      transform: rotate(-2deg) translateY(-2px) scale(1.03);
    }

    .avatar-placeholder {
      color: var(--line);
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 900;
    }

    .avatar-command,
    .small-button,
    .upload-label,
    .select-box {
      min-height: 38px;
      border: 3px solid var(--line);
      border-radius: 999px;
      color: var(--line);
      background: var(--yellow);
      box-shadow: 4px 5px 0 rgba(47, 69, 80, 0.16);
      font-weight: 900;
      transition: transform 180ms cubic-bezier(.2,.8,.2,1), background-color 180ms ease, box-shadow 180ms ease;
    }

    .avatar-command {
      background: var(--pink);
    }

    .small-button:hover,
    .upload-label:hover {
      color: var(--line);
      border-color: var(--line);
      background: var(--blue);
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: 5px 8px 0 rgba(47, 69, 80, 0.16);
    }

    .intro-lines {
      margin-top: 18px;
      padding: 14px 10px;
      border: 0;
      color: var(--line);
      background: rgba(255, 255, 255, 0.36);
      border-radius: 22px;
      line-height: 1.65;
    }

    .brand-stamp {
      margin-top: 14px;
      border: 3px solid var(--line);
      border-radius: 999px;
      color: var(--line);
      background: var(--green);
      transform: rotate(2deg);
    }

    .panel-title {
      color: var(--line);
      font-size: 1.06rem;
    }

    .nav-list {
      gap: 9px;
    }

    .nav-item {
      padding: 11px 13px;
      border: 3px solid var(--line);
      border-radius: 18px 26px 20px 24px;
      color: var(--line);
      background: rgba(255, 255, 255, 0.44);
      box-shadow: 3px 4px 0 rgba(47, 69, 80, 0.12);
      line-height: 1.32;
    }

    .nav-item:nth-child(3n + 1) {
      background: rgba(255, 216, 107, 0.72);
    }

    .nav-item:nth-child(3n + 2) {
      background: rgba(191, 239, 255, 0.8);
    }

    .nav-item:nth-child(3n) {
      background: rgba(255, 159, 183, 0.72);
    }

    .nav-item::before {
      content: none;
    }

    .nav-item::after {
      content: "";
      left: 18px;
      right: 18px;
      bottom: 7px;
      width: auto;
      height: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 200ms cubic-bezier(.2,.8,.2,1);
    }

    .nav-item:hover,
    .nav-item.is-active {
      color: var(--line);
      transform: translateX(5px) rotate(-1deg);
    }

    .nav-item:hover::after,
    .nav-item.is-active::after {
      width: auto;
      transform: scaleX(1);
    }

    .nav-item.is-active {
      background: var(--green);
      border-left-color: var(--line);
    }

    .carousel-section {
      min-height: clamp(300px, 36vh, 460px);
      padding: 18px;
      border-radius: 42px 30px 38px 34px;
      transform: rotate(0.4deg);
      overflow: visible;
    }

    .carousel-inner {
      grid-template-columns: minmax(0, 1fr) 132px;
      gap: 18px;
    }

    .photo-frame {
      min-height: clamp(260px, 32vh, 420px);
      padding: 9px;
      border: 3px solid var(--line);
      border-radius: 34px;
      background: var(--cream);
      box-shadow: 6px 8px 0 rgba(47, 69, 80, 0.12);
      transform: rotate(-1deg);
    }

    .photo-frame::before,
    .photo-frame::after,
    .card::before,
    .card::after {
      content: none;
    }

    .carousel-viewport {
      border-radius: 25px;
      background:
        radial-gradient(circle at 18% 22%, var(--yellow) 0 24px, transparent 25px),
        radial-gradient(circle at 82% 36%, var(--pink) 0 34px, transparent 35px),
        linear-gradient(180deg, var(--sky), var(--sky-soft) 58%, #b9ef83 59%);
    }

    .carousel-viewport img {
      border-radius: 23px;
      filter: saturate(1.08) contrast(1.02);
    }

    .painted-placeholder {
      border-radius: 24px;
      background:
        radial-gradient(circle at 16% 20%, var(--yellow) 0 42px, transparent 43px),
        radial-gradient(circle at 76% 22%, var(--pink) 0 34px, transparent 35px),
        linear-gradient(180deg, var(--sky) 0 58%, #c4f29a 58% 100%);
    }

    .painted-placeholder::before {
      content: "";
      position: absolute;
      top: auto;
      right: auto;
      left: 11%;
      bottom: 18%;
      width: 112px;
      height: 92px;
      border: 3px solid var(--line);
      border-radius: 26px 26px 8px 8px;
      background:
        linear-gradient(90deg, transparent 49%, var(--line) 49% 52%, transparent 52%),
        linear-gradient(0deg, transparent 48%, var(--line) 48% 51%, transparent 51%),
        var(--cream);
      transform: rotate(-3deg);
      opacity: 1;
    }

    .painted-placeholder::after {
      content: "";
      position: absolute;
      top: auto;
      left: auto;
      right: 12%;
      bottom: 19%;
      width: 88px;
      height: 104px;
      border-radius: 52% 48% 44% 56%;
      border: 3px solid var(--line);
      background: var(--green);
      box-shadow: 16px 18px 0 rgba(47, 69, 80, 0.07);
      transform: rotate(4deg);
      opacity: 1;
    }

    .placeholder-title {
      left: clamp(22px, 4vw, 54px);
      bottom: clamp(22px, 4vw, 48px);
      color: var(--line);
      font-size: clamp(2.2rem, 5vw, 5.6rem);
      line-height: 0.96;
      text-shadow: 3px 3px 0 var(--cream);
    }

    .carousel-tools {
      justify-content: space-between;
      min-width: 0;
    }

    .dot {
      width: 13px;
      height: 13px;
      border: 3px solid var(--line);
      background: var(--cream);
    }

    .dot.is-active {
      background: var(--red);
      border-color: var(--line);
    }

    .content-section {
      padding: clamp(18px, 3vw, 34px);
      border-radius: 36px 48px 38px 42px;
      transform: rotate(-0.2deg);
    }

    .section-head {
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 22px;
      border: 0;
    }

    .section-kicker {
      color: var(--red);
      font-size: 1rem;
      text-shadow: 1px 1px 0 var(--cream);
    }

    .section-title {
      color: var(--line);
      font-size: clamp(2.6rem, 5.4vw, 6rem);
      line-height: 0.94;
      text-shadow: 4px 4px 0 rgba(255, 216, 107, 0.8);
    }

    .section-subtitle {
      max-width: 650px;
      color: var(--line);
      line-height: 1.72;
      background: rgba(255, 255, 255, 0.38);
      border-radius: 22px;
      padding: 10px 14px;
    }

    .select-box {
      color: var(--line);
      background-color: var(--cream);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--line) 50%),
        linear-gradient(135deg, var(--line) 50%, transparent 50%);
    }

    .cards-flow {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: clamp(18px, 2.4vw, 30px);
      opacity: 1;
      transition: opacity 260ms ease, transform 300ms cubic-bezier(.2,.8,.2,1), filter 300ms ease;
    }

    .cards-flow.is-fading {
      animation: animePageIn 520ms cubic-bezier(.2,.8,.2,1);
    }

    .card,
    .card:nth-child(4n + 1),
    .card:nth-child(4n + 2),
    .card:nth-child(4n + 3),
    .card:nth-child(4n + 4) {
      padding: 18px;
      border: 3px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 247, 216, 0.9);
      box-shadow: 6px 8px 0 rgba(47, 69, 80, 0.12);
      transform: rotate(var(--tilt));
    }

    .card:nth-child(4n + 1) {
      --tilt: -1.2deg;
      background: rgba(255, 247, 216, 0.94);
    }

    .card:nth-child(4n + 2) {
      --tilt: 1deg;
      background: rgba(191, 239, 255, 0.92);
    }

    .card:nth-child(4n + 3) {
      --tilt: -0.7deg;
      background: rgba(255, 216, 107, 0.78);
    }

    .card:nth-child(4n + 4) {
      --tilt: 0.8deg;
      background: rgba(255, 159, 183, 0.78);
    }

    .card:hover {
      border-color: var(--line);
      transform: rotate(0deg) translateY(-5px);
      box-shadow: 8px 12px 0 rgba(47, 69, 80, 0.14);
    }

    .card-actions {
      margin: -2px 0 12px;
    }

    .card-actions .small-button,
    .card-actions .upload-label {
      min-height: 32px;
      padding: 5px 11px;
    }

    .delete-button:hover,
    .memo-delete:hover {
      color: var(--line);
      background: var(--red);
    }

    .card-image {
      border: 3px solid var(--line);
      border-radius: 22px;
      background:
        radial-gradient(circle at 25% 22%, var(--yellow) 0 18px, transparent 19px),
        linear-gradient(180deg, var(--sky) 0 60%, var(--green) 60% 100%);
      box-shadow: inset 0 -8px 0 rgba(47, 69, 80, 0.06);
    }

    .card-image img {
      border-radius: 18px;
      filter: saturate(1.08) contrast(1.02);
    }

    .card-image.empty::before {
      inset: auto 18px 26px 18px;
      height: 42px;
      border: 3px solid var(--line);
      border-top: 0;
      border-radius: 0 0 40px 40px;
      background: transparent;
    }

    .card-image.empty::after {
      inset: 18px auto auto 18px;
      width: 34px;
      height: 34px;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: var(--yellow);
    }

    .editable:focus {
      background: rgba(255, 255, 255, 0.46);
      box-shadow: 0 0 0 3px rgba(106, 182, 255, 0.45);
    }

    .card-title,
    .quote-text {
      color: var(--line);
    }

    .card-text,
    .quote-source {
      color: var(--line);
    }

    .quote-text {
      border-left: 0;
      padding: 10px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.42);
    }

    .timeline-card {
      grid-template-columns: auto 1fr;
    }

    .timeline-date {
      color: var(--line);
      background: var(--lavender);
      border: 3px solid var(--line);
      border-radius: 999px;
      box-shadow: 3px 4px 0 rgba(47, 69, 80, 0.12);
    }

    .counter span {
      width: 31px;
      height: 42px;
      color: var(--line);
      border: 3px solid var(--line);
      border-radius: 10px;
      background: var(--yellow);
      box-shadow: 3px 4px 0 rgba(47, 69, 80, 0.12);
      font-family: FangSong, STFangsong, "Songti SC", serif;
    }

    .date-label,
    .calendar-title,
    .weekday,
    .memo-date {
      color: var(--line);
    }

    .calendar-grid {
      gap: 5px;
    }

    .weekday,
    .day {
      border-radius: 13px;
      font-weight: 900;
    }

    .day {
      border: 3px solid var(--line);
      color: var(--line);
      background: rgba(255, 255, 255, 0.42);
      box-shadow: 2px 3px 0 rgba(47, 69, 80, 0.10);
    }

    .day.empty {
      opacity: 0;
      border: 0;
      box-shadow: none;
    }

    .day:not(.empty):hover {
      color: var(--line);
      border-color: var(--line);
      background: var(--blue);
      transform: translateY(-2px);
    }

    .day.today {
      color: var(--line);
      background: var(--pink);
      border-color: var(--line);
    }

    .day.marked::after {
      width: 7px;
      height: 7px;
      background: var(--red);
      box-shadow: none;
    }

    .memo,
    .memo:nth-child(2n),
    .memo:nth-child(3n) {
      color: var(--line);
      border: 3px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 216, 107, 0.82);
      box-shadow: 4px 6px 0 rgba(47, 69, 80, 0.12);
      transform: rotate(-1deg);
    }

    .memo:nth-child(2n) {
      background: rgba(191, 239, 255, 0.88);
      transform: rotate(1deg);
    }

    .memo:nth-child(3n) {
      background: rgba(255, 159, 183, 0.8);
    }

    .memo-text {
      color: var(--line);
    }

    .memo-delete {
      border: 3px solid var(--line);
      color: var(--line);
      background: var(--cream);
    }

    .empty-state {
      border: 3px solid var(--line);
      border-radius: 24px;
      color: var(--line);
      background: rgba(255, 247, 216, 0.82);
    }

    @keyframes floatSoft {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(10px) rotate(2deg);
      }
    }

    @keyframes drift {
      0% {
        margin-left: 0;
      }
      50% {
        margin-left: -28px;
      }
      100% {
        margin-left: 0;
      }
    }

    @keyframes birdFly {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-12px) translateX(24px) scale(0.92);
      }
    }

    @keyframes animePageIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @media (max-width: 1180px) {
      .carousel-inner {
        grid-template-columns: 1fr;
      }

      .carousel-tools {
        flex-direction: row;
      }

      .room-window {
        opacity: 0.55;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 12px;
      }

      .left-rail,
      .right-rail,
      .center-stage {
        position: relative;
        inset: auto;
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
        overflow: visible;
      }

      .left-rail,
      .right-rail {
        display: block;
      }

      .nav-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .profile,
      .carousel-section,
      .content-section {
        transform: none;
      }

      .room-window {
        display: none;
      }

      .sun {
        left: auto;
        right: 20px;
        top: 18px;
        width: 62px;
        height: 62px;
      }

      .tree-right {
        display: none;
      }
    }

    @media (max-width: 540px) {
      .nav-list,
      .cards-flow {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 2.45rem;
      }

      .placeholder-title {
        font-size: 2.25rem;
      }

      .timeline-card {
        grid-template-columns: 1fr;
      }

      .tree-left,
      .cloud-two,
      .bird-two {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="anime-world" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="bird bird-one"></div>
    <div class="bird bird-two"></div>
    <div class="bird bird-three"></div>
    <div class="bird bird-four"></div>
    <div class="hill hill-one"></div>
    <div class="hill hill-two"></div>
    <div class="little-house house-one"><span></span></div>
    <div class="little-house house-two"><span></span></div>
    <div class="field">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="tree tree-left"><span></span></div>
    <div class="tree tree-right"><span></span></div>
    <div class="stool"><span></span></div>
    <div class="sapling sapling-one"><span></span></div>
    <div class="bunny"><span></span></div>
    <div class="deer"><span></span></div>
    <div class="penguin"><span></span></div>
    <div class="room-window">
      <span class="curtain"></span>
      <span class="desk"></span>
      <span class="cat"></span>
    </div>
  </div>
  <aside class="left-rail">
    <section class="scrap-panel profile">
      <label class="avatar-label" for="avatarInput" aria-label="更换头像">
        <span id="avatarSlot" class="avatar-placeholder">求是</span>
      </label>
      <div class="profile-name">moonsun</div>
      <span class="avatar-command">更换头像</span>
      <div class="intro-lines">
        <span>浙江大学</span>
        <span>西藏墨脱研究生支教团</span>
      </div>
      <span class="brand-stamp">SUNNY DAYS</span>
      <input id="avatarInput" type="file" accept="image/*" hidden>
    </section>

    <nav class="scrap-panel" aria-label="栏目导航">
      <h2 class="panel-title">目录</h2>
      <div id="navList" class="nav-list"></div>
    </nav>
  </aside>

  <main class="center-stage">
    <section class="carousel-section" aria-label="相册轮播">
      <div class="carousel-inner">
        <div class="photo-frame">
          <div id="carouselViewport" class="carousel-viewport"></div>
        </div>
        <div class="carousel-tools">
          <div class="tool-stack">
            <label class="upload-label" for="carouselInput">替换相册</label>
            <input id="carouselInput" type="file" accept="image/*" multiple hidden>
            <button id="clearCarousel" class="small-button" type="button">清空相册</button>
          </div>
          <div>
            <div class="carousel-nav">
              <button id="prevSlide" class="small-button icon-button" type="button" aria-label="上一张">‹</button>
              <button id="nextSlide" class="small-button icon-button" type="button" aria-label="下一张">›</button>
            </div>
            <div id="carouselDots" class="carousel-dots" aria-label="轮播分页"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="content-section" aria-live="polite">
      <header class="section-head">
        <div>
          <span id="sectionKicker" class="section-kicker"></span>

      motuo: [
        {
          id: makeId(),

          image: ""
        },

      rugby: [
        {

          text: "没有冲撞并不意味着轻松。空间判断、传球时机和队友之间的默契，决定每一次推进。"

          text: "愿望单、成就、截图和存档，都是另一种阅读记录。"
        }
      ],
      home733: [
        {
          id: makeId(),
          type: "image",
          title: "杭州 733",
          text: "这是我和cyx、小猫李白一起生活的地方。早晨有窗光，晚上有灯，日常会在沙发、饭桌和门口鞋架之间慢慢展开。",
          image: ""
        },
        {
          id: makeId(),
          type: "quote",
          quote: "家不是一个很大的词，它有时候只是有人等你、猫在旁边、热饭刚好端上桌。",
          source: "733"
        },
        {
          id: makeId(),
          type: "timeline",
          date: "杭州",
          title: "cyx 和李白",
          text: "一起住下之后，很多普通日子都有了名字：买菜、做饭、喂猫、收拾房间、在窗边看天气。"
        }
      ],
      future: [
        {
          id: makeId(),
          type: "quote",
          quote: "待续不是空白，而是一种认真预留的位置。",
          source: "求是"
        },
        {
          id: makeId(),
          type: "text",
          title: "硕士预告",
          text: "新的研究、新的课程、新的田野会继续写进这里。"
        }
      ]
    };

    const defaultState = {
      activeSection: "linchang",
      avatar: "",
      carousel: [],
      cards: defaultCards,
      memos: [
        { id: makeId(), date: "", text: "整理支教行李清单" },
        { id: makeId(), date: "", text: "补一张临沧老照片" }
      ],
      markedDates: {}
    };

    let state = loadState();
    let githubConfig = loadGithubConfig();
    let carouselIndex = 0;
    let viewedMonth = new Date();
    let saveTimer = 0;
    let cloudSaveTimer = 0;

    const navList = document.getElementById("navList");
    const avatarInput = document.getElementById("avatarInput");
    const avatarSlot = document.getElementById("avatarSlot");
    const carouselInput = document.getElementById("carouselInput");
    const carouselViewport = document.getElementById("carouselViewport");
    const carouselDots = document.getElementById("carouselDots");
    const clearCarousel = document.getElementById("clearCarousel");
    const prevSlide = document.getElementById("prevSlide");
    const nextSlide = document.getElementById("nextSlide");
    const sectionKicker = document.getElementById("sectionKicker");
    const sectionTitle = document.getElementById("sectionTitle");
    const sectionSubtitle = document.getElementById("sectionSubtitle");
    const cardsFlow = document.getElementById("cardsFlow");
    const cardType = document.getElementById("cardType");
    const addCard = document.getElementById("addCard");
    const visitorCounter = document.getElementById("visitorCounter");
    const todayLabel = document.getElementById("todayLabel");
    const meetingCountdown = document.getElementById("meetingCountdown");
    const prevMonth = document.getElementById("prevMonth");
    const nextMonth = document.getElementById("nextMonth");
    const calendarTitle = document.getElementById("calendarTitle");
    const calendarGrid = document.getElementById("calendarGrid");
    const connectGithub = document.getElementById("connectGithub");
    const syncNow = document.getElementById("syncNow");
    const loadCloud = document.getElementById("loadCloud");
    const cloudStatus = document.getElementById("cloudStatus");
    const exportFullSite = document.getElementById("exportFullSite");
    const exportDataBackup = document.getElementById("exportDataBackup");
    const importDataInput = document.getElementById("importDataInput");
    const addMemo = document.getElementById("addMemo");
    const memoList = document.getElementById("memoList");

    init();

    function init() {
      ensureStateShape();
      incrementVisitorCounter();
      renderAvatar();
      renderNav();
      syncCarouselToDay();
      renderCarousel();
      renderSection();
      renderCalendar();
      renderMemos();
      updateCloudStatus();
      loadCloudState({ silent: true });
      bindEvents();
      window.setInterval(nextCarouselSlide, 8000);
      window.setInterval(() => loadCloudState({ silent: true, passive: true }), 60000);
    }

    function bindEvents() {
      avatarInput.addEventListener("change", handleAvatarUpload);
      carouselInput.addEventListener("change", handleCarouselUpload);

      clearCarousel.addEventListener("click", () => {
        if (!state.carousel.length) return;
        if (!confirm("清空当前轮播相册？")) return;
        state.carousel = [];
        carouselIndex = 0;
        saveState();
        renderCarousel();
      });

      prevSlide.addEventListener("click", previousCarouselSlide);
      nextSlide.addEventListener("click", nextCarouselSlide);

      navList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-section]");
        if (!button || button.dataset.section === state.activeSection) return;
        state.activeSection = button.dataset.section;
        saveState();
        renderNav();
        cardsFlow.classList.remove("is-fading");
        void cardsFlow.offsetWidth;
        renderSection();
        cardsFlow.classList.add("is-fading");
      });

      addCard.addEventListener("click", () => {
        const newCard = createCard(cardType.value);
        state.cards[state.activeSection].unshift(newCard);
        saveState();
        renderSection();
        const firstEditable = cardsFlow.querySelector(`[data-card-id="${newCard.id}"] .editable`);
        if (firstEditable) firstEditable.focus();
      });

      cardsFlow.addEventListener("input", (event) => {
        const editable = event.target.closest("[contenteditable][data-card-id][data-field]");
        if (!editable) return;
        updateCardField(editable.dataset.cardId, editable.dataset.field, editable.innerText);
        queueSave();
      });

      cardsFlow.addEventListener("click", (event) => {
        const deleteButton = event.target.closest("[data-delete-card]");
        if (!deleteButton) return;
        const cardId = deleteButton.dataset.deleteCard;
        if (!confirm("删除这张卡片？")) return;
        state.cards[state.activeSection] = state.cards[state.activeSection].filter((card) => card.id !== cardId);
        saveState();
        renderSection();
      });

      cardsFlow.addEventListener("change", async (event) => {
        const input = event.target.closest("[data-card-image]");
        if (!input || !input.files || !input.files[0]) return;
        const cardId = input.dataset.cardImage;
        const card = findCard(cardId);
        if (!card) return;
        const previous = card.image || "";
        try {
          card.image = await fileToCompressedDataUrl(input.files[0], 1200, 0.78);
          if (!saveState()) {
            card.image = previous;
            saveState();
          }
          renderSection();
        } finally {
          input.value = "";
        }
      });

      prevMonth.addEventListener("click", () => {
        viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth() - 1, 1);
        renderCalendar();
      });

      nextMonth.addEventListener("click", () => {
        viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth() + 1, 1);
        renderCalendar();
      });

      connectGithub.addEventListener("click", configureGithubSync);
      syncNow.addEventListener("click", () => syncCloudState({ manual: true }));
      loadCloud.addEventListener("click", () => loadCloudState({ silent: false }));
      exportFullSite.addEventListener("click", exportCompleteSite);
      exportDataBackup.addEventListener("click", exportBackupJson);
      importDataInput.addEventListener("change", importBackupJson);

      calendarGrid.addEventListener("click", (event) => {
        const dayButton = event.target.closest("[data-date]");
        if (!dayButton) return;
        addOrEditMemoForDate(dayButton.dataset.date);
      });

      addMemo.addEventListener("click", () => {
        const text = prompt("新增便签");
        if (!text || !text.trim()) return;
        state.memos.unshift({ id: makeId(), date: "", text: text.trim() });
        saveState();
        renderMemos();
      });

      memoList.addEventListener("input", (event) => {
        const editable = event.target.closest("[contenteditable][data-memo-id]");
        if (!editable) return;
        const memo = state.memos.find((item) => item.id === editable.dataset.memoId);
        if (!memo) return;
        memo.text = editable.innerText;
        queueSave();
      });

      memoList.addEventListener("click", (event) => {
        const deleteButton = event.target.closest("[data-delete-memo]");
        if (!deleteButton) return;
        if (!confirm("删除这张便签？")) return;
        state.memos = state.memos.filter((memo) => memo.id !== deleteButton.dataset.deleteMemo);
        saveState();
        renderMemos();
        renderCalendar();
      });
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (error) {
        console.warn("Failed to load scrapbook state", error);
      }
      return clone(defaultState);
    }

    function ensureStateShape() {
      state = {
        ...clone(defaultState),
        ...state,
        cards: {
          ...clone(defaultCards),
          ...(state.cards || {})
        },
        markedDates: state.markedDates || {},
        memos: Array.isArray(state.memos) ? state.memos : [],
        carousel: Array.isArray(state.carousel) ? state.carousel : []
      };

      sections.forEach((section) => {
        if (!Array.isArray(state.cards[section.id])) state.cards[section.id] = [];
      });

      if (!sections.some((section) => section.id === state.activeSection)) {
        state.activeSection = "linchang";
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        queueCloudSave();
        return true;
      } catch (error) {
        console.warn("Failed to save scrapbook state", error);
        alert("本地保存空间不足，建议减少或压缩图片后再试。");
        return false;
      }
    }

    function queueSave() {
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(saveState, 240);
    }

    function queueCloudSave() {
      if (!hasGithubConfig()) return;
      window.clearTimeout(cloudSaveTimer);
      cloudSaveTimer = window.setTimeout(() => syncCloudState({ manual: false }), 1800);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function incrementVisitorCounter() {
      const nextCount = Number(localStorage.getItem(VISITOR_KEY) || "0") + 1;
      localStorage.setItem(VISITOR_KEY, String(nextCount));
      const digits = String(nextCount).padStart(6, "0").slice(-6);
      visitorCounter.innerHTML = digits.split("").map((digit) => `<span>${digit}</span>`).join("");
      const today = new Date();
      todayLabel.textContent = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
      renderMeetingCountdown();
    }

    function renderMeetingCountdown() {
      const target = new Date(2027, 0, 1);
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetStart = new Date(target.getFullYear(), target.getMonth(), target.getDate());
      const days = Math.max(0, Math.ceil((targetStart - todayStart) / 86400000));
      meetingCountdown.innerHTML = `距离见面还有 <strong>${days}</strong> 天`;
    }

    async function handleAvatarUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const previous = state.avatar;
      state.avatar = await fileToCompressedDataUrl(file, 700, 0.82);
      if (!saveState()) {
        state.avatar = previous;
        saveState();
      }
      renderAvatar();
      event.target.value = "";
    }

    function renderAvatar() {
      if (state.avatar) {
        avatarSlot.className = "";
        avatarSlot.innerHTML = `<img src="${state.avatar}" alt="头像">`;
      } else {
        avatarSlot.className = "avatar-placeholder";
        avatarSlot.textContent = "求是";
      }
    }

    function renderNav() {
      navList.innerHTML = sections.map((section) => `
        <button class="nav-item${section.id === state.activeSection ? " is-active" : ""}" type="button" data-section="${section.id}">
          <span class="nav-label">${escapeHtml(section.nav)}</span>
          <span class="nav-icon nav-icon-${escapeHtml(section.icon || "star")}"></span>
        </button>
      `).join("");
    }

    function syncCarouselToDay() {
      if (!state.carousel.length) {
        carouselIndex = 0;
        return;
      }
      const dayNumber = Math.floor(Date.now() / 86400000);
      carouselIndex = dayNumber % state.carousel.length;
    }

    function renderCarousel() {
      const images = state.carousel;
      if (!images.length) {
        carouselViewport.innerHTML = `
          <div class="painted-placeholder">
            <div class="placeholder-title">Sunny<br>Days</div>
          </div>
        `;
        carouselDots.innerHTML = "";
        return;
      }

      carouselIndex = normalizeIndex(carouselIndex, images.length);
      const current = images[carouselIndex];
      carouselViewport.innerHTML = `<img src="${current.src}" alt="${escapeHtml(current.name || "轮播照片")}">`;
      carouselDots.innerHTML = images.map((_, index) => `
        <button class="dot${index === carouselIndex ? " is-active" : ""}" type="button" data-slide="${index}" aria-label="第${index + 1}张"></button>
      `).join("");

      carouselDots.querySelectorAll("[data-slide]").forEach((button) => {
        button.addEventListener("click", () => {
          carouselIndex = Number(button.dataset.slide);
          renderCarousel();
        });
      });
    }

    async function handleCarouselUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const previous = state.carousel;
      const images = [];
      for (const file of files.slice(0, 12)) {
        const src = await fileToCompressedDataUrl(file, 1500, 0.78);
        images.push({ id: makeId(), name: file.name, src });
      }
      state.carousel = images;
      carouselIndex = 0;
      if (!saveState()) {
        state.carousel = previous;
        saveState();
      }
      renderCarousel();
      event.target.value = "";
    }

    function previousCarouselSlide() {
      if (!state.carousel.length) return;
      carouselIndex = normalizeIndex(carouselIndex - 1, state.carousel.length);
      renderCarousel();
    }

    function nextCarouselSlide() {
      if (!state.carousel.length) return;
      carouselIndex = normalizeIndex(carouselIndex + 1, state.carousel.length);
      renderCarousel();
    }

    function normalizeIndex(index, length) {
      return ((index % length) + length) % length;
    }

    function renderSection() {
      const section = sections.find((item) => item.id === state.activeSection) || sections[0];
      sectionKicker.textContent = section.kicker;
      sectionTitle.textContent = section.title;
      sectionSubtitle.textContent = section.subtitle;
      renderCards();
    }

    function renderCards() {
      const cards = state.cards[state.activeSection] || [];
      if (!cards.length) {
        cardsFlow.innerHTML = `<p class="empty-state">这一页还留着空白。</p>`;
        return;
      }

      cardsFlow.innerHTML = cards.map(renderCard).join("");
    }

    function renderCard(card) {
      const actions = `
        <div class="card-actions">
          <label class="upload-label">
            配图
            <input type="file" accept="image/*" data-card-image="${card.id}" hidden>
          </label>
          <button class="small-button delete-button" type="button" data-delete-card="${card.id}">删除</button>
        </div>
      `;

      const imageBlock = card.image || card.type === "image" ? `
        <div class="card-image${card.image ? "" : " empty"}">
          ${card.image ? `<img src="${card.image}" alt="${escapeHtml(card.title || "卡片配图")}">` : ""}
        </div>
      ` : "";

      if (card.type === "quote") {
        return `
          <article class="card quote-card" data-card-id="${card.id}">
            ${actions}
            ${imageBlock}
            <div class="quote-text editable" contenteditable="true" data-card-id="${card.id}" data-field="quote">${escapeHtml(card.quote || "")}</div>
            <p class="quote-source editable" contenteditable="true" data-card-id="${card.id}" data-field="source">${escapeHtml(card.source || "")}</p>
          </article>
        `;
      }

      if (card.type === "timeline") {
        return `
          <article class="card timeline-card" data-card-id="${card.id}">
            ${actions}
            <div class="timeline-date editable" contenteditable="true" data-card-id="${card.id}" data-field="date">${escapeHtml(card.date || "")}</div>
            <div>
              ${imageBlock}
              <h3 class="card-title editable" contenteditable="true" data-card-id="${card.id}" data-field="title">${escapeHtml(card.title || "")}</h3>
              <p class="card-text editable" contenteditable="true" data-card-id="${card.id}" data-field="text">${escapeHtml(card.text || "")}</p>
            </div>
          </article>
        `;
      }

      return `
        <article class="card" data-card-id="${card.id}">
          ${actions}
          ${imageBlock}
          <h3 class="card-title editable" contenteditable="true" data-card-id="${card.id}" data-field="title">${escapeHtml(card.title || "")}</h3>
          <p class="card-text editable" contenteditable="true" data-card-id="${card.id}" data-field="text">${escapeHtml(card.text || "")}</p>
        </article>
      `;
    }

    function createCard(type) {
      const id = makeId();
      if (type === "image") {
        return { id, type, title: "新的图文卡片", text: "写下这张照片背后的故事。", image: "" };
      }
      if (type === "quote") {
        return { id, type, quote: "把想记住的话写在这里。", source: "出处" };
      }
      if (type === "timeline") {
        return { id, type, date: "日期", title: "新的时间节点", text: "记录这一刻发生了什么。" };
      }
      return { id, type: "text", title: "新的文字卡片", text: "从这里开始编辑。" };
    }

    function findCard(cardId) {
      return (state.cards[state.activeSection] || []).find((card) => card.id === cardId);
    }

    function updateCardField(cardId, field, value) {
      const card = findCard(cardId);
      if (!card) return;
      card[field] = value.trimEnd();
    }

    function renderCalendar() {
      const year = viewedMonth.getFullYear();
      const month = viewedMonth.getMonth();
      const today = new Date();
      const todayKey = toDateKey(today);
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

      calendarTitle.textContent = `${year} ${monthNames[month]}`;
      const cells = weekdays.map((day) => `<div class="weekday">${day}</div>`);

      for (let index = 0; index < firstDay; index += 1) {
        cells.push(`<div class="day empty"></div>`);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = new Date(year, month, day);
        const key = toDateKey(date);
        const isToday = key === todayKey;
        const marked = Boolean(state.markedDates[key]) || state.memos.some((memo) => memo.date === key);
        cells.push(`
          <button class="day${isToday ? " today" : ""}${marked ? " marked" : ""}" type="button" data-date="${key}">
            ${day}
          </button>
        `);
      }

      calendarGrid.innerHTML = cells.join("");
    }

    function loadGithubConfig() {
      try {
        return JSON.parse(localStorage.getItem(GITHUB_CONFIG_KEY) || "{}");
      } catch (error) {
        return {};
      }
    }

    function hasGithubConfig() {
      return Boolean(githubConfig.owner && githubConfig.repo && githubConfig.branch && githubConfig.token);
    }

    function updateCloudStatus(message) {
      if (!cloudStatus) return;
      if (message) {
        cloudStatus.textContent = message;
        return;
      }
      cloudStatus.textContent = hasGithubConfig() ? `云端：${githubConfig.owner}/${githubConfig.repo}` : "本地模式";
    }

    function configureGithubSync() {
      const owner = prompt("GitHub 用户名", githubConfig.owner || "moonsuntycyx");
      if (!owner) return;
      const repo = prompt("GitHub 仓库名", githubConfig.repo || "moonsuntycyx.github.io");
      if (!repo) return;
      const branch = prompt("分支名", githubConfig.branch || "main");
      if (!branch) return;
      const token = prompt("GitHub fine-grained token（只保存在本浏览器）", githubConfig.token || "");
      if (!token) return;
      githubConfig = { owner: owner.trim(), repo: repo.trim(), branch: branch.trim(), token: token.trim() };
      localStorage.setItem(GITHUB_CONFIG_KEY, JSON.stringify(githubConfig));
      updateCloudStatus("云端已连接");
    }

    async function loadCloudState(options = {}) {
      if (!hasGithubConfig()) {
        try {
          const response = await fetch(`${CLOUD_DATA_FILE}?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error("No public cloud data");
          const cloud = await response.json();
          applyCloudData(cloud, options);
          updateCloudStatus("已读取线上数据");
        } catch (error) {
          if (!options.silent) updateCloudStatus("请先连接云端");
          else updateCloudStatus();
        }
        return;
      }
      try {
        updateCloudStatus("正在读取云端...");
        const file = await githubRequest(`contents/${CLOUD_DATA_FILE}?ref=${encodeURIComponent(githubConfig.branch)}`, {
          method: "GET"
        });
        if (!file || !file.content) throw new Error("No cloud data");
        const decoded = decodeBase64Utf8(file.content);
        const cloud = JSON.parse(decoded);
        applyCloudData(cloud, options);
        updateCloudStatus("云端数据已读取");
      } catch (error) {
        if (!options.silent) {
          updateCloudStatus("读取失败，可能还没有云端数据");
          alert("读取云端失败。请确认 token、仓库名、分支名正确，或先点一次“立即上传”。");
        } else {
          updateCloudStatus();
        }
      }
    }

    function applyCloudData(cloud, options = {}) {
      if (!cloud || !cloud.data) return;
      if (options.passive && hasGithubConfig()) return;
      state = cloud.data;
      ensureStateShape();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAvatar();
      renderNav();
      renderCarousel();
      renderSection();
      renderCalendar();
      renderMemos();
    }

    async function syncCloudState(options = {}) {
      if (!hasGithubConfig()) {
        if (options.manual) alert("请先点击“连接云端”，填写 GitHub 仓库和 token。");
        updateCloudStatus("请先连接云端");
        return;
      }
      try {
        updateCloudStatus("正在上传云端...");
        const currentFile = await getCloudFileSha();
        const backup = {
          version: 1,
          updatedAt: new Date().toISOString(),
          data: state
        };
        const body = {
          message: `Update moonsun site data ${new Date().toISOString()}`,
          content: encodeBase64Utf8(JSON.stringify(backup, null, 2)),
          branch: githubConfig.branch
        };
        if (currentFile && currentFile.sha) body.sha = currentFile.sha;
        await githubRequest(`contents/${CLOUD_DATA_FILE}`, {
          method: "PUT",
          body: JSON.stringify(body)
        });
        updateCloudStatus("云端已更新");
        if (options.manual) alert("已上传到 GitHub。GitHub Pages 通常需要几十秒到一两分钟生效。");
      } catch (error) {
        console.warn("Cloud sync failed", error);
        updateCloudStatus("上传失败");
        if (options.manual) alert("上传失败。请确认 token 有该仓库 Contents 读写权限。");
      }
    }

    async function getCloudFileSha() {
      try {
        return await githubRequest(`contents/${CLOUD_DATA_FILE}?ref=${encodeURIComponent(githubConfig.branch)}`, {
          method: "GET"
        });
      } catch (error) {
        return null;
      }
    }

    async function githubRequest(path, options) {
      const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/${path}`, {
        ...options,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${githubConfig.token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options && options.headers ? options.headers : {})
        }
      });
      if (!response.ok) {
        throw new Error(`GitHub API ${response.status}`);
      }
      return response.json();
    }

    function encodeBase64Utf8(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = "";
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function decodeBase64Utf8(value) {
      const binary = atob(value.replace(/\s/g, ""));
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function exportCompleteSite() {
      saveState();
      let html = document.documentElement.outerHTML;
      const existingBootStart = html.indexOf('  <script id="embeddedScrapbookState">');
      const mainScriptStart = html.indexOf("  <script>\n    const STORAGE_KEY");
      if (existingBootStart !== -1 && mainScriptStart > existingBootStart) {
        html = html.slice(0, existingBootStart) + html.slice(mainScriptStart);
      }
      const bootScript = `
  <script id="embeddedScrapbookState">
    localStorage.setItem(${JSON.stringify(STORAGE_KEY)}, ${JSON.stringify(JSON.stringify(state))});
  <\/script>`;
      const exportHtml = html.replace("  <script>\n    const STORAGE_KEY", `${bootScript}\n  <script>\n    const STORAGE_KEY`);
      downloadFile(
        exportHtml,
        `moonsun-site-${getExportStamp()}.html`,
        "text/html;charset=utf-8"
      );
    }

    function exportBackupJson() {
      saveState();
      const backup = {
        version: 1,
        exportedAt: new Date().toISOString(),
        storageKey: STORAGE_KEY,
        data: state
      };
      downloadFile(
        JSON.stringify(backup, null, 2),
        `moonsun-site-backup-${getExportStamp()}.json`,
        "application/json;charset=utf-8"
      );
    }

    function importBackupJson(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const backup = JSON.parse(reader.result);
          const importedState = backup.data || backup;
          if (!importedState || typeof importedState !== "object") {
            throw new Error("Invalid backup");
          }
          state = importedState;
          ensureStateShape();
          saveState();
          carouselIndex = 0;
          renderAvatar();
          renderNav();
          renderCarousel();
          renderSection();
          renderCalendar();
          renderMemos();
          alert("备份已导入。");
        } catch (error) {
          alert("导入失败，请确认选择的是本站导出的 JSON 备份。");
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function getExportStamp() {
      const now = new Date();
      const parts = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0")
      ];
      return `${parts[0]}${parts[1]}${parts[2]}-${parts[3]}${parts[4]}`;
    }

    function addOrEditMemoForDate(dateKey) {
      const existing = state.memos.find((memo) => memo.date === dateKey);
      const text = prompt(`给 ${dateKey} 留一张便签`, existing ? existing.text : "");
      if (text === null) return;

      if (text.trim()) {
        if (existing) {
          existing.text = text.trim();
        } else {
          state.memos.unshift({ id: makeId(), date: dateKey, text: text.trim() });
        }
        state.markedDates[dateKey] = true;
      } else {
        state.markedDates[dateKey] = !state.markedDates[dateKey];
      }

      saveState();
      renderCalendar();
      renderMemos();
    }

    function renderMemos() {
      if (!state.memos.length) {
        memoList.innerHTML = `<p class="empty-state">暂无便签。</p>`;
        return;
      }

      memoList.innerHTML = state.memos.map((memo) => `
        <article class="memo">
          <button class="memo-delete" type="button" data-delete-memo="${memo.id}" aria-label="删除便签">×</button>
          ${memo.date ? `<div class="memo-date">${escapeHtml(memo.date)}</div>` : ""}
          <div class="memo-text editable" contenteditable="true" data-memo-id="${memo.id}">${escapeHtml(memo.text)}</div>
        </article>
      `).join("");
    }

    function toDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function fileToCompressedDataUrl(file, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = () => {
          const rawUrl = reader.result;
          const image = new Image();
          image.onload = () => {
            const longest = Math.max(image.width, image.height);
            const scale = longest > maxSide ? maxSide / longest : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          image.onerror = () => resolve(rawUrl);
          image.src = rawUrl;
        };
        reader.readAsDataURL(file);
      });
    }
  </script>
